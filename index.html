<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>私聊客服</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; background:#f0f0f0; height:100vh; display:flex; flex-direction:column; }

/* 登录页 */
.login { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:20px; }
.login h2 { margin-bottom:8px; color:#333; }
.login p { color:#999; font-size:13px; margin-bottom:24px; }
.login input { width:100%; max-width:300px; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:12px; font-size:16px; }
.login button { width:100%; max-width:300px; padding:12px; background:#07c160; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; }

/* 主人界面 */
.admin-layout { display:flex; height:100vh; }
.sidebar { width:150px; background:#fff; border-right:1px solid #eee; overflow-y:auto; flex-shrink:0; }
.sidebar-header { padding:12px; background:#1890ff; color:#fff; font-size:14px; text-align:center; }
.visitor-item { padding:10px 8px; border-bottom:1px solid #f5f5f5; cursor:pointer; position:relative; }
.visitor-item.active { background:#e6f7ff; }
.visitor-item .name { font-size:13px; font-weight:500; margin-bottom:2px; }
.visitor-item .preview { font-size:11px; color:#999; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { position:absolute; right:6px; top:8px; background:#f5222d; color:#fff; font-size:10px; padding:1px 5px; border-radius:8px; }

/* 聊天区 */
.chat-area { flex:1; display:flex; flex-direction:column; }
.header { background:#07c160; color:#fff; padding:12px; text-align:center; font-size:15px; }
#log { flex:1; overflow-y:auto; padding:12px; background:#fafafa; }
.msg { max-width:75%; margin:8px 0; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.5; word-break:break-word; }
.me { background:#95ec69; margin-left:auto; }
.other { background:#fff; }
.msg img, .msg audio { max-width:100%; border-radius:8px; margin-top:4px; display:block; }
.system { text-align:center; color:#999; font-size:12px; margin:6px 0; }
.input-bar { display:flex; gap:6px; padding:10px; background:#f9f9f9; border-top:1px solid #ddd; align-items:center; }
.input-bar input[type=text] { flex:1; padding:10px 14px; border:1px solid #ddd; border-radius:20px; outline:none; font-size:15px; }
.icon-btn { width:40px; height:40px; border:none; background:#07c160; color:#fff; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.icon-btn.recording { background:#f5222d; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.send-btn { padding:10px 18px; background:#07c160; color:#fff; border:none; border-radius:20px; font-size:14px; cursor:pointer; }

/* 访客界面 */
.visitor-layout { display:flex; flex-direction:column; height:100vh; }
.hidden { display:none; }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login" id="loginPage">
  <h2 id="loginTitle">💬 进入聊天</h2>
  <p id="loginSub">私聊客服 · 支持文字/图片/语音</p>
  <input id="nicknameInput" placeholder="输入昵称（可选）">
  <button onclick="enterChat()">进入</button>
</div>

<!-- 主人界面 -->
<div class="admin-layout" id="adminPage" style="display:none;">
  <div class="sidebar">
    <div class="sidebar-header">访客列表</div>
    <div id="visitorList"></div>
  </div>
  <div class="chat-area">
    <div class="header" id="chatHeader">选择访客开始聊天</div>
    <div id="log"></div>
    <div class="input-bar" id="inputBar" style="display:none;">
      <button class="icon-btn" onclick="document.getElementById('imgInputOwner').click()" title="发图片">🖼️</button>
      <button class="icon-btn" id="voiceBtnOwner" onclick="toggleRecord('owner')" title="按住录音">🎤</button>
      <input type="file" id="imgInputOwner" accept="image/*" class="hidden" onchange="sendImage('owner')">
      <input type="text" id="txt" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send('owner')">
      <button class="send-btn" onclick="send('owner')">发送</button>
    </div>
  </div>
</div>

<!-- 访客界面 -->
<div class="visitor-layout" id="visitorPage" style="display:none;">
  <div class="header" id="visitorHeader">💬 私聊中</div>
  <div id="visitorLog" style="flex:1;overflow-y:auto;padding:12px;"></div>
  <div class="input-bar">
    <button class="icon-btn" onclick="document.getElementById('imgInputVisitor').click()" title="发图片">🖼️</button>
    <button class="icon-btn" id="voiceBtnVisitor" onclick="toggleRecord('visitor')" title="按住录音">🎤</button>
    <input type="file" id="imgInputVisitor" accept="image/*" class="hidden" onchange="sendImage('visitor')">
    <input type="text" id="visitorTxt" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send('visitor')">
    <button class="send-btn" onclick="send('visitor')">发送</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAEXbHQBLEXtzKaMwlwI1vno_rZoYQxIRU",
  authDomain: "xiaobawang-a52d5.firebaseapp.com",
  databaseURL: "https://xiaobawang-a52d5-default-rtdb.firebaseio.com",
  projectId: "xiaobawang-a52d5",
  storageBucket: "xiaobawang-a52d5.firebasestorage.app",
  messagingSenderId: "1053586934882",
  appId: "1:1053586934882:web:8023ce628a1f4615e8d53b",
  measurementId: "G-KGPFSYNXEW"
}
firebase.initializeApp(firebaseConfig)
const db = firebase.database()

const params = new URL(location.href).searchParams
const isOwner = params.get('role') === 'owner'
const roomId = params.get('room') || '001'

let currentVisitorId = null
let visitorId = null
let nickname = ''
let mediaRecorder = null
let audioChunks = []

// ===== 身份判断 =====
if (isOwner) {
  document.getElementById('loginPage').style.display = 'none'
  document.getElementById('adminPage').style.display = 'flex'
  loadVisitorList()
} else {
  document.getElementById('loginTitle').innerText = '💬 私聊客服'
}

function enterChat() {
  nickname = document.getElementById('nicknameInput').value.trim() || ('访客' + Math.random().toString(36).slice(2,5))
  visitorId = 'v_' + Math.random().toString(36).slice(2,8)
  
  document.getElementById('loginPage').style.display = 'none'
  document.getElementById('visitorPage').style.display = 'flex'
  document.getElementById('visitorHeader').innerText = '💬 私聊中（' + nickname + '）'
  
  db.ref(`rooms/${roomId}/${visitorId}/info`).set({ nickname, joinedAt: Date.now() })
  
  db.ref(`rooms/${roomId}/${visitorId}/messages`).on('child_added', snap => appendMsg('visitor', snap.val()))
  db.ref(`rooms/${roomId}/${visitorId}/info`).update({ hasNew: true })
}

// ===== 主人：加载访客列表 =====
function loadVisitorList() {
  db.ref(`rooms/${roomId}`).on('value', snap => {
    const data = snap.val() || {}
    const listEl = document.getElementById('visitorList')
    listEl.innerHTML = ''
    
    Object.keys(data).forEach(vid => {
      if (vid === 'info') return
      const info = data[vid].info || {}
      const messages = data[vid].messages || {}
      const msgArr = Object.values(messages)
      const last = msgArr.length > 0 ? msgArr[msgArr.length - 1] : null
      const unread = data[vid].info && data[vid].info.hasNew && vid !== currentVisitorId
      
      const div = document.createElement('div')
      div.className = 'visitor-item' + (vid === currentVisitorId ? ' active' : '')
      let preview = '暂无消息'
      if (last) {
        if (last.type === 'image') preview = '🖼️ 图片'
        else if (last.type === 'voice') preview = '🎤 语音'
        else preview = (last.from === 'owner' ? '你: ' : '') + last.text.slice(0,15)
      }
      div.innerHTML = `
        <div class="name">${info.nickname || vid}</div>
        <div class="preview">${preview}</div>
        ${unread ? '<span class="badge">新</span>' : ''}
      `
      div.onclick = () => selectVisitor(vid, info.nickname || vid)
      listEl.appendChild(div)
    })
  })
}

// ===== 主人：选择访客 =====
function selectVisitor(vid, name) {
  currentVisitorId = vid
  document.getElementById('chatHeader').innerText = '💬 ' + name
  document.getElementById('inputBar').style.display = 'flex'
  document.getElementById('log').innerHTML = ''
  
  db.ref(`rooms/${roomId}/${vid}/info`).update({ hasNew: false })
  loadVisitorList()
  
  db.ref(`rooms/${roomId}/${vid}/messages`).off('child_added')
  db.ref(`rooms/${roomId}/${vid}/messages`).on('child_added', snap => appendMsg('owner', snap.val()))
}

// ===== 发送文字 =====
function send(role) {
  const vid = role === 'owner' ? currentVisitorId : visitorId
  if (!vid) return
  const inputId = role === 'owner' ? 'txt' : 'visitorTxt'
  const input = document.getElementById(inputId)
  const text = input.value.trim()
  if (!text) return
  
  db.ref(`rooms/${roomId}/${vid}/messages`).push({
    type: 'text', from: role, text, time: Date.now()
  })
  input.value = ''
  notifyNew(vid)
}

// ===== 发送图片 =====
function sendImage(role) {
  const vid = role === 'owner' ? currentVisitorId : visitorId
  if (!vid) return
  const inputId = role === 'owner' ? 'imgInputOwner' : 'imgInputVisitor'
  const file = document.getElementById(inputId).files[0]
  if (!file) return
  
  // 限制大小 500KB，避免 Firebase 单条数据超限
  if (file.size > 500 * 1024) {
    alert('图片太大，请压缩到 500KB 以内')
    return
  }
  
  const reader = new FileReader()
  reader.onload = e => {
    db.ref(`rooms/${roomId}/${vid}/messages`).push({
      type: 'image', from: role, data: e.target.result, time: Date.now()
    })
    notifyNew(vid)
  }
  reader.readAsDataURL(file)
  document.getElementById(inputId).value = ''
}

// ===== 语音录制 =====
async function toggleRecord(role) {
  const btn = document.getElementById(role === 'owner' ? 'voiceBtnOwner' : 'voiceBtnVisitor')
  
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop()
    btn.classList.remove('recording')
    btn.innerText = '🎤'
    return
  }
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    mediaRecorder = new MediaRecorder(stream)
    audioChunks = []
    
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data)
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' })
      const reader = new FileReader()
      reader.onload = e => {
        const vid = role === 'owner' ? currentVisitorId : visitorId
        if (!vid) return
        db.ref(`rooms/${roomId}/${vid}/messages`).push({
          type: 'voice', from: role, data: e.target.result, time: Date.now()
        })
        notifyNew(vid)
      }
      reader.readAsDataURL(blob)
      // 关闭麦克风
      stream.getTracks().forEach(t => t.stop())
    }
    
    mediaRecorder.start()
    btn.classList.add('recording')
    btn.innerText = '⏹️'
  } catch (err) {
    alert('需要麦克风权限才能录音')
  }
}

// ===== 通知新消息 =====
function notifyNew(vid) {
  if (isOwner) return
  db.ref(`rooms/${roomId}/${vid}/info`).update({ hasNew: true })
}

// ===== 渲染消息 =====
function appendMsg(role, m) {
  const logId = role === 'owner' ? 'log' : 'visitorLog'
  const log = document.getElementById(logId)
  const div = document.createElement('div')
  
  if (!m || m.type === 'system') {
    div.className = 'system'
    div.innerText = m ? m.text : ''
  } else {
    div.className = 'msg ' + (m.from === role ? 'me' : 'other')
    if (m.type === 'text') {
      div.innerText = m.text
    } else if (m.type === 'image') {
      div.innerHTML = '<img src="' + m.data + '" onclick="window.open(this.src)">'
    } else if (m.type === 'voice') {
      div.innerHTML = '<audio controls src="' + m.data + '"></audio>'
    }
  }
  
  log.appendChild(div)
  log.scrollTop = log.scrollHeight
}
</script>
</body>
</html>
