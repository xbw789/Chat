<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小霸王聊天室</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
  body{font-family:sans-serif;margin:0;padding:0;background:#f5f5f5;}
  .box{max-width:480px;margin:0 auto;background:#fff;height:100vh;display:flex;flex-direction:column;}
  .header{padding:10px 15px;background:#1890ff;color:#fff;display:flex;justify-content:space-between;align-items:center;}
  .status{font-size:12px;}
  #log{flex:1;overflow-y:auto;padding:15px;background:#fafafa;}
  .msg{max-width:70%;padding:8px 12px;border-radius:8px;margin-bottom:8px;word-break:break-all;}
  .me{background:#1890ff;color:#fff;margin-left:auto;}
  .other{background:#e5e5ea;color:#000;}
  .system{text-align:center;color:#999;font-size:12px;margin:5px 0;}
  .input-area{display:flex;padding:10px;background:#fff;border-top:1px solid #eee;}
  #txt{flex:1;padding:8px;border:1px solid #ccc;border-radius:4px;outline:none;}
  button{padding:8px 15px;margin-left:8px;background:#1890ff;color:#fff;border:none;border-radius:4px;}
  #typing{font-size:12px;color:#999;padding:0 15px;height:20px;}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <div><span id="roleLabel">聊天室</span> <span class="status" id="status">连接中...</span></div>
    <div style="font-size:12px;">房间: 001</div>
  </div>
  <div id="log"></div>
  <div id="typing"></div>
  <div class="input-area">
    <input id="txt" placeholder="输入消息..." oninput="notifyTyping()">
    <button onclick="send()">发送</button>
  </div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAEXbHQBLEXtzKaMwlwI1vno_rZoYQxIRU",
  authDomain: "xiaobawang-a52d5.firebaseapp.com",
  databaseURL: "https://xiaobawang-a52d5-default-rtdb.firebaseio.com",
  projectId: "xiaobawang-a52d5",
  storageBucket: "xiaobawang-a52d5.firebasestorage.app",
  messagingSenderId: "1053586934882",
  appId: "1:1053586934882:web:8023ce628a1f4615e8d53b",
  measurementId: "G-KGPFSYNXEW"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const roomId = "001";
const urlParams = new URLSearchParams(location.search);
const role = urlParams.get("role") === "owner" ? "owner" : "guest";

document.getElementById("roleLabel").innerText = role === "owner" ? "当前：主人" : "当前：访客";
document.getElementById("roleLabel").style.color = role === "owner" ? "#fff" : "#07c160";

function updatePresence(){
  if(role==="owner"){
    db.ref(`rooms/${roomId}/presence/owner`).set({online:true,lastSeen:Date.now()});
    window.addEventListener("beforeunload",()=>db.ref(`rooms/${roomId}/presence/owner`).set({online:false,lastSeen:Date.now()}));
  }
}
db.ref(`rooms/${roomId}/presence/owner`).on("value",snap=>{
  const val=snap.val();
  document.getElementById("status").innerText=val&&val.online?"🟢 主人在线":"⚪ 主人离线";
});

db.ref(`rooms/${roomId}/messages`).on("child_added",snap=>appendMsg(snap.val()));
function appendMsg(m){
  const log=document.getElementById("log");
  const div=document.createElement("div");
  if(m.type==="system"){div.className="system";div.innerText=m.text;}
  else{div.className="msg "+(m.from===role?"me":"other");div.innerText=m.text;}
  log.appendChild(div);log.scrollTop=log.scrollHeight;
}
function send(){
  const input=document.getElementById("txt"),text=input.value.trim();
  if(!text)return;
  db.ref(`rooms/${roomId}/messages`).push({from:role,text,time:Date.now(),type:"text"});
  input.value="";
  if(role==="guest"){
    db.ref(`rooms/${roomId}/presence/owner`).once("value",snap=>{
      const val=snap.val(),isOffline=!val||!val.online;
      if(isOffline)setTimeout(()=>db.ref(`rooms/${roomId}/messages`).push({from:"owner",text:"你好，我目前不在线，看到消息会尽快回复你～",time:Date.now(),type:"auto"}),1500);
    });
  }
}
let typingTimer;
function notifyTyping(){
  if(role==="guest"){
    db.ref(`rooms/${roomId}/typing`).set({from:"guest",time:Date.now()});
    clearTimeout(typingTimer);typingTimer=setTimeout(()=>db.ref(`rooms/${roomId}/typing`).remove(),3000);
  }
}
db.ref(`rooms/${roomId}/typing`).on("value",snap=>{
  const val=snap.val(),typingEl=document.getElementById("typing");
  typingEl.innerText=val&&val.from!==role&&Date.now()-val.time<3000?"对方正在输入...":"";
});
updatePresence();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)updatePresence()});
</script>
</body>
</html>
